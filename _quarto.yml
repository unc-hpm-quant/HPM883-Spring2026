project:
  type: website
  output-dir: _site
  resources:
    - "quiz-generator/questions.js"
    - "unit-2/media/*.mp4"
    - "unit-2/media/*.gif"
  render:
    - "*"
    - "!unit-1/shiny-oed-app.qmd"
    - "!problem-sets/solutions/ps-1-solutions.qmd"
    - "!problem-sets/solutions/ps-2-solutions.qmd"
format:
  html:
    theme:
      light: [cosmo, style/hpm883.scss]
      dark: [cosmo, style/hpm883-dark.scss]
    mainfont: "Times New Roman"
    highlight-style: a11y-light
    include-in-header:
      - text: |
          <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
          <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
          <script src="https://unpkg.com/lodash@4.17.21/lodash.min.js"></script>

website:
  page-navigation: true
  title: "HPM 883 - Spring 2026"
  description: "Homepage for HPM 883: Advanced Quantitative Methods for Health Policy and Management - Spring 2026"
  site-url: https://hpm883.ssylvia.io
  repo-url: https://github.com/unc-hpm-quant/HPM883-Spring2026
  repo-actions: [edit, issue]

  draft-mode: unlinked
 
